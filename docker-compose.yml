version: '3.8'

services:
  # ── PostgreSQL ──────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: loanforge-postgres
    environment:
      POSTGRES_USER: loanforge
      POSTGRES_PASSWORD: loanforge_secret
      POSTGRES_DB: loanforge_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U loanforge -d loanforge_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: loanforge-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Server ──────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loanforge-api
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://loanforge:loanforge_secret@postgres:5432/loanforge_db
      REDIS_URL: redis://redis:6379
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    restart: unless-stopped

volumes:
  pgdata:
  redis-data:
  uploads:
  logs:
